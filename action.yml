name: wouldrun
description: >-
  Work out which GitHub Actions workflows a pull request would trigger, and
  report it as a job summary or, opt-in, a sticky PR comment.
author: "Cole Munz"

branding:
  icon: "git-pull-request"
  color: "blue"

inputs:
  post-comment:
    description: >-
      Post the FIRES/SKIPPED table as a single sticky PR comment, found and
      updated in place on every later run instead of piling up a new comment
      per push. Opt-in: needs `pull-requests: write` on the calling job.
      Default "false" writes the same table to $GITHUB_STEP_SUMMARY instead,
      which needs no extra permission.
    required: false
    default: "false"
  github-token:
    description: >-
      Token used to read and update the sticky PR comment when post-comment
      is "true", and on pull_request_target to fetch the PR's head commit.
    required: false
    default: ${{ github.token }}
  python-version:
    description: Python version used to run wouldrun.
    required: false
    default: "3.x"
  workflow:
    description: >-
      Only report these workflows, one per line, each matched like the CLI's
      --workflow (name, file name, stem, or path). A name that matches nothing
      fails the step. Default "" reports every workflow.
    required: false
    default: ""

outputs:
  fires:
    description: '"true" if at least one reported workflow would fire, "false" if none would. Empty when the action skipped.'
    value: ${{ steps.report.outputs.fires }}
  fired-count:
    description: How many reported workflows would fire. Empty when the action skipped.
    value: ${{ steps.report.outputs.fired-count }}
  fired-workflows:
    description: A one-line JSON array of the paths of the workflows that would fire. Empty when the action skipped.
    value: ${{ steps.report.outputs.fired-workflows }}

runs:
  using: composite
  steps:
    - name: Check for a pull_request context
      # This action only has something to evaluate on a pull_request (or
      # pull_request_target) event -- there's no PR base/changed-files to
      # diff against otherwise. Guard here instead of letting a later step
      # fail with a confusing git or argument error if someone wires this
      # into a different trigger by mistake.
      id: guard
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        if [ -z "$PR_NUMBER" ]; then
          {
            echo "wouldrun: no pull_request context on this event "
            echo "(event=\`$EVENT_NAME\`); nothing to evaluate against, skipping."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout
      if: steps.guard.outputs.skip != 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # Full history for every branch, not just the checked-out ref --
        # `--diff` below needs a local `origin/<base>` to diff against, and
        # a fresh, full fetch on every run is also what makes this correct
        # across force-pushes and re-runs: there's no stale cached ref to
        # go out of date, it's refetched from scratch each time.
        fetch-depth: 0

    - name: Set up Python
      if: steps.guard.outputs.skip != 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Fetch the PR head on pull_request_target
      # That event checks out the base branch; fetch the head commit so it can
      # be diffed, and never check it out.
      if: steps.guard.outputs.skip != 'true' && github.event_name == 'pull_request_target'
      shell: bash
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        FETCH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -e
        if [ -n "$FETCH_TOKEN" ]; then
          auth=$(printf 'x-access-token:%s' "$FETCH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
        fi
        git -C "$GITHUB_WORKSPACE" fetch --no-tags --quiet origin "+$HEAD_SHA:refs/remotes/wouldrun/pr-head"

    - name: Run wouldrun against the PR's base and changed files
      # The cwd goes first on sys.path, so Python never runs from the PR checkout.
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        PYTHONPATH: ${{ github.action_path }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        ACTIVITY_TYPE: ${{ github.event.action }}
        WORKFLOWS: ${{ inputs.workflow }}
      run: |
        set -e
        head_args=()
        if [ "$EVENT_NAME" = "pull_request_target" ]; then
          head_args=(--head "$HEAD_SHA")
        fi
        workflow_args=()
        while IFS= read -r name; do
          if [[ $name =~ [^[:space:]] ]]; then
            workflow_args+=(--workflow "$name")
          fi
        done <<< "$WORKFLOWS"
        python3 -m wouldrun "$GITHUB_WORKSPACE" \
          --event "$EVENT_NAME" \
          --base "$BASE_REF" \
          --type "$ACTIVITY_TYPE" \
          --diff "origin/$BASE_REF" \
          "${head_args[@]}" \
          "${workflow_args[@]}" \
          --json > "$RUNNER_TEMP/wouldrun.json"

    - name: Run wouldrun as pull_request_target against the base branch's workflows
      # GitHub runs those for the same pull request, from the base branch's copy.
      # Only .github/workflows is checked out, and nothing from the PR head.
      if: steps.guard.outputs.skip != 'true' && github.event_name == 'pull_request'
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        PYTHONPATH: ${{ github.action_path }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        ACTIVITY_TYPE: ${{ github.event.action }}
      run: |
        set -e
        base_tree="$RUNNER_TEMP/wouldrun-base"
        git -C "$GITHUB_WORKSPACE" worktree remove --force "$base_tree" 2>/dev/null || true
        rm -rf "$base_tree"
        git -C "$GITHUB_WORKSPACE" worktree add --quiet --detach --no-checkout "$base_tree" "origin/$BASE_REF"
        trap 'git -C "$GITHUB_WORKSPACE" worktree remove --force "$base_tree"' EXIT
        if git -C "$base_tree" cat-file -e "HEAD:.github/workflows" 2>/dev/null; then
          git -C "$base_tree" checkout --quiet HEAD -- .github/workflows
        fi
        python3 -c 'import json, sys; print("\n".join(json.load(open(sys.argv[1], encoding="utf-8"))["event"]["changed_files"]))' \
          "$RUNNER_TEMP/wouldrun.json" > "$RUNNER_TEMP/wouldrun-changed.txt"
        python3 -m wouldrun "$base_tree" \
          --event pull_request_target \
          --base "$BASE_REF" \
          --type "$ACTIVITY_TYPE" \
          --changed-from "$RUNNER_TEMP/wouldrun-changed.txt" \
          --json > "$RUNNER_TEMP/wouldrun-target.json"

    - name: Format the report and set the outputs
      id: report
      if: steps.guard.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        PYTHONPATH: ${{ github.action_path }}
        EVENT_NAME: ${{ github.event_name }}
        WORKFLOWS: ${{ inputs.workflow }}
      run: |
        set -e
        reports=("$RUNNER_TEMP/wouldrun.json")
        if [ "$EVENT_NAME" = "pull_request" ]; then
          reports+=("$RUNNER_TEMP/wouldrun-target.json")
        fi
        workflow_args=()
        while IFS= read -r name; do
          if [[ $name =~ [^[:space:]] ]]; then
            workflow_args+=(--workflow "$name")
          fi
        done <<< "$WORKFLOWS"
        python3 -m wouldrun.pr_format --github-output "$GITHUB_OUTPUT" \
          "${workflow_args[@]}" "${reports[@]}" > "$RUNNER_TEMP/wouldrun.md"

    - name: Write job summary
      if: steps.guard.outputs.skip != 'true' && inputs.post-comment != 'true'
      shell: bash
      run: cat "$RUNNER_TEMP/wouldrun.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Post or update the sticky PR comment
      # scripts/sticky-comment.js edits only a comment this action's own account
      # wrote, and falls back to the job summary when the token is read-only.
      if: steps.guard.outputs.skip != 'true' && inputs.post-comment == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          const path = require("path");
          const { postStickyComment } = require(
            path.join(process.env.WOULDRUN_ACTION_PATH, "scripts", "sticky-comment.js")
          );
          await postStickyComment({
            github,
            context,
            core,
            body: fs.readFileSync(process.env.WOULDRUN_MD, "utf8"),
            summaryPath: process.env.GITHUB_STEP_SUMMARY,
          });
      env:
        WOULDRUN_MD: ${{ runner.temp }}/wouldrun.md
        WOULDRUN_ACTION_PATH: ${{ github.action_path }}
